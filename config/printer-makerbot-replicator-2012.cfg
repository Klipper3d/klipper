# This file contains pin mappings and machine settings for the original
# dual-extruder MakerBot Replicator with a MightyBoard Rev.E and the
# external MakerBot Interface Board.
#
# MightyBoard Rev.E may use an Atmel atmega1280 or atmega2560. Check the
# marking on the installed chip and select the matching MCU before compiling.
# The bootloader protocol may vary. Stock boards commonly use stk500v2 at
# 57600 baud, while upgraded boards may use wiring at 115200 baud. Verify the
# installed bootloader and press the board's RESET button immediately before
# invoking avrdude.
# Verify the serial device, thermistor, travel limits, PID values, and
# tool offsets on the actual printer before heating or moving the machine.

[stepper_x]
step_pin: PF1
dir_pin: !PF0
enable_pin: !PF2
microsteps: 16
rotation_distance: 34
endstop_pin: ^!PL1
position_endstop: 264
position_min: -8
position_max: 264
homing_speed: 50

[stepper_y]
step_pin: PF5
dir_pin: !PF4
enable_pin: !PF6
microsteps: 16
rotation_distance: 34
endstop_pin: ^!PL3
position_endstop: 152
position_min: -2
position_max: 152
homing_speed: 50

[stepper_z]
step_pin: PK1
dir_pin: !PK0
enable_pin: !PK2
microsteps: 16
rotation_distance: 8
endstop_pin: !PL6
position_endstop: 0
position_min: 0
position_max: 150
homing_speed: 4

[extruder]
step_pin: PA3
dir_pin: !PA2
enable_pin: !PA4
microsteps: 16
rotation_distance: 33.238
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PH3
sensor_type: MAX6675
sensor_pin: PE3
spi_software_miso_pin: PE5
spi_software_sclk_pin: PE2
spi_software_mosi_pin: PA1 # Dummy MOSI pin; MAX6675 is read-only.
control: pid
pid_kp: 36.67
pid_ki: 3.86
pid_kd: 87.11
min_temp: 5
max_temp: 280

[extruder1]
step_pin: PA7
dir_pin: PA6
enable_pin: !PG2
microsteps: 16
rotation_distance: 33.238
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB5
sensor_type: MAX6675
sensor_pin: PE4
spi_software_miso_pin: PE5
spi_software_sclk_pin: PE2
spi_software_mosi_pin: PA1 # Dummy MOSI pin; MAX6675 is read-only.
control: pid
pid_kp: 36.67
pid_ki: 3.86
pid_kd: 87.11
min_temp: 5
max_temp: 280

# The second nozzle is 33mm to the left of the first nozzle. The macros use
# the left nozzle as the coordinate reference, matching existing MightyBoard
# dual-extruder Klipper configurations.
[gcode_macro T0]
gcode:
    SET_GCODE_OFFSET X=-33
    ACTIVATE_EXTRUDER EXTRUDER=extruder

[gcode_macro T1]
gcode:
    SET_GCODE_OFFSET X=0
    ACTIVATE_EXTRUDER EXTRUDER=extruder1

[heater_fan extruder_fan]
pin: PH4
heater: extruder
heater_temp: 50

[heater_fan extruder1_fan]
pin: PB6
heater: extruder1
heater_temp: 50

# Comment out this section before enabling sample-mightyboard-laser.cfg,
# because the optional laser configuration reuses the same FET output.
[fan]
pin: PL5

# Marlin thermistor table 99: a 100K bed thermistor with a 10K pull-up.
[thermistor MightyBoard Bed 100K]
temperature1: 20
resistance1: 125374
temperature2: 100
resistance2: 6343
temperature3: 130
resistance3: 2719

[heater_bed]
heater_pin: PL4
sensor_type: MightyBoard Bed 100K
sensor_pin: PK7
pullup_resistor: 10000
control: pid
pid_kp: 51.04
pid_ki: 6.92
pid_kd: 250.85
min_temp: 5
max_temp: 130

[mcu]
# Replace this with the stable path reported by:
#   ls /dev/serial/by-id/
serial: /dev/ttyAMA0
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 1000
max_z_velocity: 19
max_z_accel: 150

# The scale is the A4988 maximum current implied by the MightyBoard's
# 0.250-ohm sense resistors and 1.666V maximum reference voltage.
[mcp4018 x_axis_pot]
i2c_software_scl_pin: PJ5
i2c_software_sda_pin: PF3
wiper: 0.81
scale: 0.833

[mcp4018 y_axis_pot]
i2c_software_scl_pin: PJ5
i2c_software_sda_pin: PF7
wiper: 0.81
scale: 0.833

[mcp4018 z_axis_pot]
i2c_software_scl_pin: PJ5
i2c_software_sda_pin: PK3
wiper: 0.28
scale: 0.833

[mcp4018 a_axis_pot]
i2c_software_scl_pin: PJ5
i2c_software_sda_pin: PA5
wiper: 0.81
scale: 0.833

[mcp4018 b_axis_pot]
i2c_software_scl_pin: PJ5
i2c_software_sda_pin: PJ6
wiper: 0.81
scale: 0.833

# External MakerBot Interface Board: HD44780 over a 3-wire shift register.
[display]
lcd_type: hd44780_spi
spi_software_mosi_pin: PC3
spi_software_sclk_pin: PC2
spi_software_miso_pin: PJ1 # Dummy MISO pin; the display is write-only.
latch_pin: PC4
click_pin: ^PJ0
back_pin: ^PJ2
up_pin: ^PJ4
down_pin: ^PJ3

[pwm_cycle_time beeper]
pin: PG5
value: 0
shutdown_value: 0
cycle_time: 0.001

[gcode_macro M300]
gcode:
    {% set frequency = params.S|default(1000)|int %}
    {% set duration = params.P|default(100)|int %}
    SET_PIN PIN=beeper VALUE=0.5 CYCLE_TIME={1.0 / frequency if frequency > 0 else 1}
    G4 P{duration}
    SET_PIN PIN=beeper VALUE=0

[pca9533 interface_leds]
i2c_bus: twi
i2c_address: 98
initial_RED: 1
initial_GREEN: 1
initial_BLUE: 1
