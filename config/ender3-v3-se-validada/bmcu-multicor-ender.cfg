[bmcu_integracao_ender]
dispositivo: bmcu0
destino: extruder
captura_mm: 20
captura_f: 180
avanco_bico_mm: 80
purga_mm: 70
avanco_f: 120
recuo_f: 600
recuo_apos_switch_mm: 55
tempo_switch: 60
x_purga: -6
x_limpeza: -4
y_purga: 123
alivio_z: 2
limpezas: 3

[gcode_macro BMCU_PREPARAR_ENDER]
gcode:
  BMCU_ENDER_CARREGAR {rawparams}

[gcode_macro BMCU_LIBERAR_ENDER]
gcode:
  BMCU_ENDER_LIBERAR {rawparams}

[gcode_macro BMCU_CONFIGURAR_MULTICOR]
gcode:
  {% set b = printer['bmcu'] %}
  {% set sensor = printer['filament_switch_sensor bmcu_entry'] %}
  {% if printer.print_stats.state in ['printing', 'paused'] or b.active_operations or b.print_map_active or b.print_plan_open %}
    {action_raise_error('The printer and BMCU must be idle before setup.')}
  {% endif %}
  {% if sensor.filament_detected %}
    {action_raise_error('The entry sensor must be clear and all channels parked.')}
  {% endif %}
  {% for d in b.devices %}
    {% if d.loaded_channels or d.uncertain_channels %}
      {action_raise_error('Park all channels before setup.')}
    {% endif %}
  {% endfor %}
  BMCU_SPEED DEVICE=bmcu0 LOAD=10 PULL=10 PULL_END=4 SAVE=1
  BMCU_SET_ENDPOINT NAME=extruder DRIVER=generic_single_extruder EXTRUDER=extruder TOOLHEAD_PREPARE_MACRO=BMCU_PREPARAR_ENDER BEFORE_PULLBACK_MACRO=BMCU_LIBERAR_ENDER ENTRY_SENSOR=filament_switch_sensor:bmcu_entry SENSOR_POLICY=managed MAX_ROUTE_MM=1500 CONTACT_TIMEOUT=180 AUTO_REFILL=0

[gcode_macro ENDER_INICIAR_MULTICOR]
gcode:
  {% set bed_temp = params.TEMP_MESA|float %}
  {% set nozzle_temp = params.TEMP_BICO|float %}
  {% set tool = params.FERRAMENTA|int %}
  G90
  M83
  M140 S{bed_temp}
  M104 S{[nozzle_temp, 150.0]|min}
  M190 S{bed_temp}
  BED_MESH_CLEAR
  G28
  BED_MESH_PROFILE LOAD=default
  G1 Z10 F300
  M109 S{nozzle_temp}
  SET_FILAMENT_SENSOR SENSOR=bmcu_entry ENABLE=1
  BMCU_TROCAR_ENDER TOOL={tool} PURGAR_SE_CARREGADO=1
  G92 E0
  G1 Z5 F300

[gcode_macro ENDER_FINALIZAR_MULTICOR]
gcode:
  M400
  BMCU_PRINT_END MODE=KEEP CLEAR=1
  ENDER_FINALIZAR_IMPRESSAO
