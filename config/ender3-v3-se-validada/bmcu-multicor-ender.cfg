[bmcu_ender_integration]
device: bmcu0
destination: extruder
capture_mm: 20
capture_feedrate: 180
nozzle_feed_mm: 80
purge_mm: 35
feed_feedrate: 120
retract_feedrate: 300
unload_step_mm: 1
unload_slack_mm: 2
pullback_after_sensor_mm: 55
sensor_timeout: 60
purge_x: -6
wipe_x: -3
purge_y: 123
z_lift: 2
wipes: 6

[gcode_macro BMCU_PREPARE_ENDER]
gcode:
  BMCU_ENDER_LOAD {rawparams}

[gcode_macro BMCU_RELEASE_ENDER]
gcode:
  BMCU_ENDER_UNLOAD {rawparams}

[gcode_macro BMCU_SETUP_MULTICOLOR]
gcode:
  {% set b = printer['bmcu'] %}
  {% set sensor = printer['filament_switch_sensor bmcu_entry'] %}
  {% if printer.print_stats.state in ['printing', 'paused'] or b.active_operations or b.print_map_active or b.print_plan_open %}
    {action_raise_error('The printer and BMCU must be idle before setup.')}
  {% endif %}
  {% if sensor.filament_detected %}
    {action_raise_error('The entry sensor must be clear and all channels parked.')}
  {% endif %}
  {% for d in b.devices %}
    {% if d.loaded_channels or d.uncertain_channels %}
      {action_raise_error('Park all channels before setup.')}
    {% endif %}
  {% endfor %}
  BMCU_SPEED DEVICE=bmcu0 LOAD=10 PULL=10 PULL_END=4 SAVE=1
  BMCU_SET_ENDPOINT NAME=extruder DRIVER=generic_single_extruder EXTRUDER=extruder TOOLHEAD_PREPARE_MACRO=BMCU_PREPARE_ENDER BEFORE_PULLBACK_MACRO=BMCU_RELEASE_ENDER ENTRY_SENSOR=filament_switch_sensor:bmcu_entry SENSOR_POLICY=managed MAX_ROUTE_MM=1500 CONTACT_TIMEOUT=180 AUTO_REFILL=0

[gcode_macro ENDER_START_MULTICOLOR]
gcode:
  {% set bed_temp = params.BED_TEMP|float %}
  {% set nozzle_temp = params.NOZZLE_TEMP|float %}
  {% set tool = params.TOOL|int %}
  G90
  M83
  M140 S{bed_temp}
  M104 S{[nozzle_temp, 150.0]|min}
  M190 S{bed_temp}
  BED_MESH_CLEAR
  G28
  BED_MESH_PROFILE LOAD=default
  G1 Z10 F300
  BMCU_ENDER_MOVE_TO_PURGE
  M109 S{nozzle_temp}
  SET_FILAMENT_SENSOR SENSOR=bmcu_entry ENABLE=1
  BMCU_CHANGE_TOOL_ENDER TOOL={tool} PURGE_IF_LOADED=1
  G92 E0
  G1 Z5 F300

[gcode_macro ENDER_END_MULTICOLOR]
gcode:
  M400
  BMCU_PRINT_END MODE=KEEP CLEAR=1
  ENDER_END_PRINT
