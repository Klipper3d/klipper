[include bmcu-controles-ajustes.cfg]

[gcode_macro PRE_AQUECER_PLA]
description: Pré-aquecer PLA
gcode:
  _ENDER_PANEL_PREHEAT MATERIAL=PLA

[gcode_macro PRE_AQUECER_PETG]
description: Pré-aquecer PETG
gcode:
  _ENDER_PANEL_PREHEAT MATERIAL=PETG

[gcode_macro PRE_AQUECER_TPU]
description: Pré-aquecer TPU
gcode:
  _ENDER_PANEL_PREHEAT MATERIAL=TPU

[gcode_macro _ENDER_PANEL_PREHEAT]
gcode:
  {% set settings = printer["gcode_macro _ENDER_PANEL_SETTINGS"] %}
  {% set material = params.MATERIAL|upper %}
  {% if printer.print_stats.state in ['printing', 'paused'] or printer.bmcu.active_operations or printer['bmcu_integracao_ender'].manual_busy %}
    {action_raise_error("Finish the current operation before preheating.")}
  {% endif %}
  {% set nozzle = settings[material|lower ~ '_nozzle']|float %}
  {% set bed = settings[material|lower ~ '_bed']|float %}
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET={nozzle}
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed}

[gcode_macro RETIRAR_FILAMENTO]
description: Aquecer a 230 °C e retirar o canal carregado
gcode:
  BMCU_ENDER_MANUAL ACTION=UNLOAD

[gcode_macro CARREGAR_CANAL_1]
description: Carregar canal físico 1 e purgar
gcode:
  BMCU_ENDER_MANUAL ACTION=LOAD CHANNEL=1

[gcode_macro CARREGAR_CANAL_2]
description: Carregar canal físico 2 e purgar
gcode:
  BMCU_ENDER_MANUAL ACTION=LOAD CHANNEL=2

[gcode_macro CARREGAR_CANAL_3]
description: Carregar canal físico 3 e purgar
gcode:
  BMCU_ENDER_MANUAL ACTION=LOAD CHANNEL=3

[gcode_macro CARREGAR_CANAL_4]
description: Carregar canal físico 4 e purgar
gcode:
  BMCU_ENDER_MANUAL ACTION=LOAD CHANNEL=4
