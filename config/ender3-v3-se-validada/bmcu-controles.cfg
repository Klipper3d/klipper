[include bmcu-controles-ajustes.cfg]

[gcode_macro PREHEAT_PLA]
description: Preheat PLA / Pré-aquecer PLA
gcode:
  _ENDER_PANEL_PREHEAT MATERIAL=PLA

[gcode_macro PREHEAT_PETG]
description: Preheat PETG / Pré-aquecer PETG
gcode:
  _ENDER_PANEL_PREHEAT MATERIAL=PETG

[gcode_macro PREHEAT_TPU]
description: Preheat TPU / Pré-aquecer TPU
gcode:
  _ENDER_PANEL_PREHEAT MATERIAL=TPU

[gcode_macro _ENDER_PANEL_PREHEAT]
gcode:
  {% set settings = printer["gcode_macro _ENDER_PANEL_SETTINGS"] %}
  {% set material = params.MATERIAL|upper %}
  {% if printer.print_stats.state in ['printing', 'paused'] or printer.bmcu.active_operations or printer['bmcu_ender_integration'].manual_busy %}
    {action_raise_error("Finish the current operation before preheating.")}
  {% endif %}
  {% set nozzle = settings[material|lower ~ '_nozzle']|float %}
  {% set bed = settings[material|lower ~ '_bed']|float %}
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET={nozzle}
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed}

[gcode_macro UNLOAD_ACTIVE_CHANNEL]
description: Heat to 230 °C and unload / Aquecer a 230 °C e retirar
gcode:
  BMCU_ENDER_MANUAL ACTION=UNLOAD

[gcode_macro LOAD_CHANNEL_1]
description: Load physical channel 1 and purge / Carregar canal físico 1 e purgar
gcode:
  BMCU_ENDER_MANUAL ACTION=LOAD CHANNEL=1

[gcode_macro LOAD_CHANNEL_2]
description: Load physical channel 2 and purge / Carregar canal físico 2 e purgar
gcode:
  BMCU_ENDER_MANUAL ACTION=LOAD CHANNEL=2

[gcode_macro LOAD_CHANNEL_3]
description: Load physical channel 3 and purge / Carregar canal físico 3 e purgar
gcode:
  BMCU_ENDER_MANUAL ACTION=LOAD CHANNEL=3

[gcode_macro LOAD_CHANNEL_4]
description: Load physical channel 4 and purge / Carregar canal físico 4 e purgar
gcode:
  BMCU_ENDER_MANUAL ACTION=LOAD CHANNEL=4
