[gcode_macro _BMCU_ENDER_CUTTER_SETTINGS]
variable_enabled: 0
variable_calibrated: 0
variable_servo: "bmcu_cortador"
variable_retracted_angle: 0.0
variable_deployed_angle: 90.0
variable_approach_x: -9999.0
variable_contact_x: None
variable_cut_x: -9999.0
variable_cut_y: -9999.0
variable_keep_cut_y: 0
variable_minimum_z: 10.0
variable_z_lift: 2.0
variable_maximum_stroke_mm: 15.0
variable_travel_feedrate: 3000.0
variable_cut_feedrate: 300.0
variable_servo_wait_ms: 500
variable_release_retracted_servo: 1
variable_pre_cut_retract_mm: 0.0
variable_pushback_mm: 10.0
variable_pushback_feedrate: 120.0
variable_retract_feedrate: 600.0
variable_feed_feedrate: 240.0
variable_purge_feedrate: 180.0
variable_parallel_positioning: 1
gcode:
  {action_respond_info("Cutter profile: measure positions and test before enabling.")}

[gcode_macro CUTTER_SERVO]
description: Test only the servo after confirming clearance
gcode:
  BMCU_ENDER_SERVO {rawparams}

[gcode_macro TEST_CUTTER]
description: Mechanical cutter test without filament
gcode:
  BMCU_ENDER_TEST_CUTTER {rawparams}

[gcode_macro RESET_BMCU]
description: Confirm a clear path after manual removal without feeding filament
gcode:
  BMCU_ENDER_RESET CONFIRM={params.CONFIRM|default(0)|int}
