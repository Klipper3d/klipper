[gcode_macro ENDER_INICIAR_IMPRESSAO]
description: Heat, load the mesh and print with the loaded channel
gcode:
  {% if 'TEMP_MESA' not in params or 'TEMP_BICO' not in params %}
  {action_raise_error("Provide TEMP_MESA and TEMP_BICO through the Orca profile.")}
  {% endif %}
  {% set bed_temp = params.TEMP_MESA|float %}
  {% set nozzle_temp = params.TEMP_BICO|float %}
  {% set routes = printer['bmcu'].loaded_tools.keys()|list %}
  {% if routes|length != 1 or not routes[0].startswith('bmcu0:') %}
  {action_raise_error("Load filament and confirm the physically loaded channel before printing.")}
  {% endif %}
  {% set channel = routes[0].split(':')[1]|int %}
  G90
  M83
  M107
  M140 S{bed_temp}
  M104 S{[nozzle_temp, 150]|min}
  M190 S{bed_temp}
  BED_MESH_CLEAR
  G28
  BED_MESH_PROFILE LOAD=default
  G1 Z5 F300
  G1 X5 Y20 F6000
  M109 S{nozzle_temp}
  BMCU_BUFFER_MODE DEVICE=bmcu0 CHANNEL={channel} MODE=FOLLOW
  G92 E0
  G1 Z0.28 F300
  G1 Y190 E15 F1200
  G1 X5.6 F1800
  G1 Y20 E15 F1200
  G92 E0
  G1 Z1 F300

[gcode_macro ENDER_FINALIZAR_IMPRESSAO]
description: Stop feeding, turn heaters off and present the print
gcode:
  {% set lift = [5.0, printer.toolhead.axis_maximum.z - printer.toolhead.position.z]|min %}
  M400
  BMCU_STOP
  TURN_OFF_HEATERS
  M107
  {% if 'z' in printer.toolhead.homed_axes and lift > 0 %}
  G91
  G1 Z{lift} F300
  {% endif %}
  G90
  {% if 'x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes %}
  G1 X10 Y220 F6000
  {% endif %}
  M400
  M84
