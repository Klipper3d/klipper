[gcode_macro ENDER_INICIAR_IMPRESSAO]
description: Aquecer, carregar a malha e imprimir com o canal já carregado
gcode:
  {% if 'TEMP_MESA' not in params or 'TEMP_BICO' not in params %}
  {action_raise_error("Informe TEMP_MESA e TEMP_BICO pelo perfil do Orca.")}
  {% endif %}
  {% set mesa = params.TEMP_MESA|float %}
  {% set bico = params.TEMP_BICO|float %}
  {% set rotas = printer['bmcu'].loaded_tools.keys()|list %}
  {% if rotas|length != 1 or not rotas[0].startswith('bmcu0:') %}
  {action_raise_error("Carregue o filamento e confirme o canal realmente carregado como LOADED antes de imprimir.")}
  {% endif %}
  {% set canal = rotas[0].split(':')[1]|int %}
  G90
  M83
  M107
  M140 S{mesa}
  M104 S{[bico, 150]|min}
  M190 S{mesa}
  BED_MESH_CLEAR
  G28
  BED_MESH_PROFILE LOAD=default
  G1 Z5 F300
  G1 X5 Y20 F6000
  M109 S{bico}
  BMCU_BUFFER_MODE DEVICE=bmcu0 CHANNEL={canal} MODE=FOLLOW
  G92 E0
  G1 Z0.28 F300
  G1 Y190 E15 F1200
  G1 X5.6 F1800
  G1 Y20 E15 F1200
  G92 E0
  G1 Z1 F300

[gcode_macro ENDER_FINALIZAR_IMPRESSAO]
description: Parar a alimentação, desligar aquecimento e apresentar a peça
gcode:
  {% set subida = [5.0, printer.toolhead.axis_maximum.z - printer.toolhead.position.z]|min %}
  M400
  BMCU_STOP
  TURN_OFF_HEATERS
  M107
  {% if 'z' in printer.toolhead.homed_axes and subida > 0 %}
  G91
  G1 Z{subida} F300
  {% endif %}
  G90
  {% if 'x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes %}
  G1 X10 Y220 F6000
  {% endif %}
  M400
  M84
