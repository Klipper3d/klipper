# Arrival switch after BMCU, Orange Pi Zero 3:
# COM -> physical pin 6 (GND); NO -> physical pin 16 (PC15).
# Identify PC15 with gpiodetect/gpioinfo on the installed Linux image.
# gpiochip/line numbers depend on the kernel; physical pins are not GPIO IDs.
# Requires Klipper's host Linux MCU (see docs/RPi_microcontroller.md).
# Uncomment after identifying PC15; replace N and O with the actual indices.
# Reuse an existing [mcu host] section instead of duplicating it.
#
# [mcu host]
# serial: /tmp/klipper_host_mcu
#
# [filament_switch_sensor bmcu_entry]
# switch_pin: ^!host:gpiochipN/gpioO
# pause_on_runout: False
#
# ^ enables pull-up; ! means closing NO to GND detects filament. Verify using
# QUERY_FILAMENT_SENSOR SENSOR=bmcu_entry (with and without filament).
# BMCU owns runout handling. Do not add insert_gcode that starts LOAD or
# runout macros that compete with BMCU operations.
# A distant switch must NOT be ENTRY_SENSOR: v1.0.6 stops feeding as soon as
# it triggers. Use physically validated contact arrival at the gears, or
# move the switch to a position where the tip can already be captured.
