# The stock display encoder is connected to the mainboard. The display UART
# itself is USART2 PA3/PA2 and is enabled in the MCU build configuration.

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]

[display_status]

[respond]

[e3v3se_display]
# Supported languages: en (default), pt_BR. Restart Klipper after changing.
language: en
mcu: mcu
display_baud: 115200
encoder_pins: ^PA12, ^PA11
click_pin: ^!PB1
encoder_steps_per_detent: 4
max_hotend_temp: 260
max_bed_temp: 100
z_offset_min: -5
z_offset_max: 5
preheat_pla_nozzle: 200
preheat_pla_bed: 60
preheat_petg_nozzle: 230
preheat_petg_bed: 70
preheat_tpu_nozzle: 230
preheat_tpu_bed: 50
heat_timeout: 300

[e3v3se_display macro load_filament]
label: Load filament
gcode: LOAD_FILAMENT

[e3v3se_display macro unload_filament]
label: Unload filament
gcode: UNLOAD_FILAMENT
