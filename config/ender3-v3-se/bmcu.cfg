# Ender integration: one physical extruder, four channels at one endpoint.
# Requires modules/services installed by BMCU-Klipper v1.0.6.
# The installer owns [bmcu] and UART1 transport (TX PG06 / RX PG07).
# Do not add another [bmcu] or copy its Python modules into this repository.

[include bmcu-sensor.cfg]

[gcode_macro _ENDER_BMCU_SETTINGS]
# 'contact': BMCU feeds until contact at the gears; a distant switch is
# diagnostic only. 'sensor': switch at the inlet, with the tip capturable.
variable_arrival_mode: "unconfigured"
variable_arrival_validated: 0
variable_max_route_mm: 0.0
variable_contact_timeout: 30.0
gcode:
  {action_respond_info("Calibrate BMCU arrival and run BMCU_SETUP_ENDER")}

[gcode_macro _ENDER_VALIDATE_BMCU]
gcode:
  {% set s = printer["gcode_macro _ENDER_BMCU_SETTINGS"] %}
  {% if s.arrival_validated|int != 1 or s.arrival_mode not in ('contact', 'sensor') %}
    {action_raise_error("Physically validate BMCU arrival at the gears")}
  {% endif %}
  {% if 'bmcu' not in printer or printer.bmcu.package_version != '1.0.6' %}
    {action_raise_error("This integration requires BMCU-Klipper 1.0.6")}
  {% endif %}

[gcode_macro BMCU_SETUP_ENDER]
description: Manually configure four channels for one extruder
gcode:
  {% set s = printer["gcode_macro _ENDER_BMCU_SETTINGS"] %}
  {% if s.arrival_mode not in ('contact', 'sensor') or s.max_route_mm < 10 or s.max_route_mm > 5000 %}
    {action_raise_error("Set arrival mode and measured route limit")}
  {% endif %}
  {% if 'bmcu' not in printer or printer.bmcu.package_version != '1.0.6' %}
    {action_raise_error("Install BMCU-Klipper 1.0.6 before setup")}
  {% endif %}
  {% if s.arrival_mode == 'sensor' and 'filament_switch_sensor bmcu_entry' not in printer %}
    {action_raise_error("Configure and verify the PC15 switch")}
  {% endif %}
  # Run only with empty routes and an idle printer. The package checks this.
  BMCU_SET_ENDPOINT NAME=main DRIVER=generic_single_extruder EXTRUDER=extruder TOOLHEAD_PREPARE_MACRO=BMCU_TOOLHEAD_PREPARE BEFORE_PULLBACK_MACRO=BMCU_BEFORE_PULLBACK ENTRY_SENSOR={'filament_switch_sensor:bmcu_entry' if s.arrival_mode == 'sensor' else '""'} POST_GEARS_SENSOR="" MOTION_SENSOR="" MAX_ROUTE_MM={s.max_route_mm} CONTACT_TIMEOUT={s.contact_timeout} AUTO_REFILL=0
  {% for channel in range(4) %}
    BMCU_SET_ROUTE DEVICE=bmcu0 CHANNEL={channel} ENDPOINT=main
  {% endfor %}

[gcode_macro BMCU_TOOLHEAD_PREPARE]
description: Capture filament delivered by BMCU at the gears
gcode:
  _ENDER_VALIDATE_BMCU
  # WAIT=1: the core may confirm LOADED only after purge completes.
  {% set material = params.MATERIAL|default('PLA')|upper %}
  {% if material not in ('PLA', 'PETG') and printer.extruder.target < 170 %}
    {action_raise_error("Set an appropriate material temperature")}
  {% endif %}
  LOAD_FILAMENT WAIT=1 MATERIAL="{material}"

[gcode_macro BMCU_BEFORE_PULLBACK]
description: Form the tip and release the extruder before BMCU pullback
gcode:
  _ENDER_VALIDATE_BMCU
  {% set material = params.MATERIAL|default('PLA')|upper %}
  {% if material not in ('PLA', 'PETG') and printer.extruder.target < 170 %}
    {action_raise_error("Set an appropriate material temperature")}
  {% endif %}
  UNLOAD_FILAMENT WAIT=1 MATERIAL="{material}"
