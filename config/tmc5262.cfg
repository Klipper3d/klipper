# TMC5262 driver-port example for Klipper and Kalico.
# Reference only: the port installer does not copy this file to the printer.
# Copy this section into printer.cfg, then replace every REPLACE_WITH value.
# This file intentionally contains no stepper, MCU, endstop, or printer setup.
# Those settings depend on the controller board and the individual printer.
# This standalone driver needs no AutoTune plugin or XIAO capture hardware.
# For the complete tuner + XIAO setup, also use tmc5262-autotune.cfg.
# If this driver section already exists, edit it instead of adding a duplicate.
# Each comment block names the setting directly below it. "Get it from" tells
# you where to find a printer-specific value; "Choose" is a behavior choice.
# Value-selection help: docs/tuning/README.md#find-the-values-for-your-printer

# The name after "tmc5262" must exactly match an existing stepper section.
[tmc5262 stepper_x]

# cs_pin - Chip-select pin for THIS driver socket.
# Get it from: the controller maker's Klipper config/pinout for your exact
# board revision and socket, or your verified existing TMC5262 section.
# Replace the placeholder; do not copy another printer's pin.
cs_pin: REPLACE_WITH_YOUR_TMC5262_CS_PIN

# spi_bus - Hardware SPI bus connected to THIS driver socket.
# Get it from: the same controller config/schematic used for cs_pin.
# Keep a verified existing bus. If your board uses software SPI instead,
# follow its maker's configuration; do not invent a hardware bus name.
spi_bus: REPLACE_WITH_YOUR_SPI_BUS

# interpolate - Whether the driver inserts intermediate microsteps.
# Choose: keep your established setting, or start with False as shown.
# True uses internal 256-microstep interpolation; this is a preference,
# not a value to obtain from your motor's specification.
interpolate: False

# run_current - Requested motor current in RMS amps; NOT a tuning result.
# Get it from: a tested value for this exact motor/driver setup, or the
# motor and carrier makers' Klipper RMS guidance and cooling requirements.
# The LDO-42STH48-2504AH sheet says 2.5 A DC/phase, not a universal safe
# run_current. 1.0 A below is an example for initial checks, not a guarantee.
# If only a peak/DC rating is given, confirm its meaning with the maker;
# do not assume a rating or another printer's current is correct for yours.
run_current: 1.0

# rref - The REF-to-GND resistor already fitted to the driver, in ohms.
# Get it from: your carrier's schematic/BOM or its manufacturer's answer.
# 12 kohm = 12000 ohms. This is NOT motor resistance, a sense resistor,
# or power_stage_resistance. The port's default is 12000; verify the board
# matches it. If the fitted value is unknown, ask the carrier maker.
rref: 12000

# stealthchop_threshold - The driver's configured chopper-mode threshold.
# Choose: 0 for SpreadCycle at all speeds; a positive value enables
# StealthChop+ below that speed (mm/s). Keep your intended operating mode;
# the tuner does not choose a better mode or recommend this threshold.
# For StealthChop+, the entire tuning speed range must stay in that mode.
stealthchop_threshold: 0

# driver_COIL_INDUCT - Motor PHASE inductance in microhenries (uH).
# Required when stealthchop_threshold is positive; harmless in SpreadCycle.
# Get it from: the exact motor model/revision's data sheet. Convert mH to uH
# by multiplying by 1000: 1.5 mH becomes 1500 uH. Do not estimate it from
# motor size or current. The value below is only the LDO-42STH48-2504AH
# example used by this project; replace it for a different motor.
driver_COIL_INDUCT: 1500

# The port automatically configures T_RCOIL_MEAS and thermal coupling. Before
# a StealthChop+ home it enables the participating motor at YOUR configured
# current, waits 250 ms without step pulses, and requires a valid RCOIL result.
# It does not reduce or otherwise change run_current/hold_current. A failed
# measurement or driver fault cancels homing and disables the motors.

# Optional motor-coil temperature estimate - StealthChop+ only.
# This is a referenced resistance estimate, not a direct temperature sensor.
# First let the unpowered motor fully reach a known room temperature. Run M84
# so the motor is disabled, then run:
# TMC_COIL_TEMP_REFERENCE_5262 STEPPER=stepper_x TEMPERATURE=YOUR_ROOM_C
# The command temporarily uses equal IRUN/IHOLD scale 64 (above the data-sheet
# measurement minimum), performs two independent no-step enable cycles, waits
# for three stable RCOIL samples in each, rejects mismatched cycles, restores
# your exact configured current, and prints four coil_temperature_reference_*
# lines. Copy those lines here manually and restart Klipper. They are
# deliberately not saved automatically.
# Read the estimate later with:
# TMC_COIL_TEMP_5262 STEPPER=stepper_x
# Sampling is rejected while the motor is enabled, during a print, outside
# StealthChop+, below the data-sheet current threshold, when RCOIL is invalid,
# or when repeated measurements disagree. The value includes bridge and wiring
# resistance, so low-resistance motors have reduced absolute accuracy. No XIAO
# or AutoTune installation is used for this feature.
# coil_temperature_reference_celsius: 25.0
# coil_temperature_reference_resistance_a: REPLACE_WITH_CAPTURED_OHMS
# coil_temperature_reference_resistance_b: REPLACE_WITH_CAPTURED_OHMS
# coil_temperature_reference_current_range: REPLACE_WITH_CAPTURED_AMPS_RMS

# Optional DIAG and sensorless-homing configuration is independent of this
# example and must follow the printer controller and carrier documentation.
# The driver alone does not reserve DO0/DO1 for capture. Enabling XIAO capture
# does: permanent capture requires physical endstops; temporary sensorless use
# requires the electrical checks in docs/wiring-diagrams/README.md.
# SPI-only and disabled XIAO sections do not change DO0/DO1 routing.
