[gcode_macro _BMCU_AJUSTES_PURGA]
variable_x_purga: -6.0
variable_x_limpeza: -4.0
variable_y_teste: 123.0
variable_velocidade_deslocamento: 1200.0
variable_velocidade_limpeza: 600.0
variable_passadas: 3
gcode:
  {action_respond_info("Purga em X=-6; limpeza até X=-4; teste em Y=123.")}

[gcode_macro BMCU_TESTAR_PURGA]
description: Testar a purga e a limpeza com o filamento já carregado
gcode:
  {% set ajustes = printer["gcode_macro _BMCU_AJUSTES_PURGA"] %}
  {% set rotas = printer["bmcu"].loaded_tools.keys()|list %}
  {% set avanco = params.MM|default(50)|float %}
  {% set velocidade = params.VELOCIDADE|default(120)|float %}
  {% set temperatura = params.TEMP|default(230)|float %}
  {% if printer.print_stats.state in ('printing', 'paused') %}
    {action_raise_error("Execute este teste com a impressora ociosa.")}
  {% endif %}
  {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes or 'z' not in printer.toolhead.homed_axes %}
    {action_raise_error("Faça o home dos três eixos antes do teste.")}
  {% endif %}
  {% if rotas|length != 1 %}
    {action_raise_error("É necessário exatamente um canal confirmado como LOADED.")}
  {% endif %}
  {% if not rotas[0].startswith('bmcu0:') %}
    {action_raise_error("O canal carregado precisa pertencer à bmcu0.")}
  {% endif %}
  {% if not (avanco > 0 and velocidade > 0 and temperatura > 0) %}
    {action_raise_error("Informe MM, VELOCIDADE e TEMP positivos.")}
  {% endif %}
  {% set canal = rotas[0].split(':')[1]|int %}
  {% set quantidade = (avanco / 10.0)|round(0, 'ceil')|int %}
  M400
  SAVE_GCODE_STATE NAME=BMCU_TESTE_PURGA
  G90
  M83
  M220 S100
  M221 S100
  G1 X{ajustes.x_purga} Y{ajustes.y_teste} F{ajustes.velocidade_deslocamento}
  M109 S{temperatura}
  BMCU_BUFFER_MODE DEVICE=bmcu0 CHANNEL={canal} MODE=FOLLOW
  {% for indice in range(quantidade) %}
    G1 E{avanco / quantidade} F{velocidade}
  {% endfor %}
  M400
  G4 P1000
  BMCU_BUFFER_MODE DEVICE=bmcu0 CHANNEL={canal} MODE=STOP
  {% for indice in range(ajustes.passadas|int) %}
    G1 X{ajustes.x_limpeza} F{ajustes.velocidade_limpeza}
    G1 X{ajustes.x_purga} F{ajustes.velocidade_limpeza}
  {% endfor %}
  G1 X{ajustes.x_limpeza} F{ajustes.velocidade_limpeza}
  M400
  RESTORE_GCODE_STATE NAME=BMCU_TESTE_PURGA
  {action_respond_info("Teste no canal físico %d: %.1f mm a F%.1f. O bico permanecerá na posição final da limpeza." % (canal + 1, avanco, velocidade))}
