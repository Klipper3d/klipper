[gcode_macro _ENDER_FILAMENT_SETTINGS]
variable_calibrated: 0
variable_sensor_to_gears_mm: -1.0
variable_capture_mm: 0.0
variable_melt_mm: 0.0
variable_purge_mm: 0.0
variable_tip_push_mm: 0.0
variable_tip_retract_mm: 0.0
variable_cooling_move_mm: 0.0
variable_cooling_moves: 0
variable_tip_dwell_ms: 0
variable_unload_mm: 0.0
variable_capture_speed: 3.0
variable_melt_speed: 3.0
variable_purge_speed: 2.0
variable_tip_push_speed: 2.0
variable_tip_retract_speed: 10.0
variable_cooling_speed: 3.0
variable_unload_speed: 5.0
variable_chunk_mm: 10.0
gcode:
  {action_respond_info("Edit and calibrate _ENDER_FILAMENT_SETTINGS")}

[gcode_macro CANCEL_PRINT]
description: Cancel the print and stop filament feeding
rename_existing: BASE_CANCEL_PRINT
gcode:
  ENDER_FILAMENT_CANCEL
  TURN_OFF_HEATERS
  M107
  BASE_CANCEL_PRINT
  {% if "BMCU_STOP" in printer.gcode.commands %}
    BMCU_STOP
  {% endif %}

[gcode_macro LOAD_FILAMENT]
description: Heat, capture, load and purge filament
gcode:
  _ENDER_VALIDATE_FILAMENT ACTION=LOAD
  ENDER_FILAMENT ACTION=LOAD {rawparams}

[gcode_macro UNLOAD_FILAMENT]
description: Heat, form the tip and release the extruder gears
gcode:
  _ENDER_VALIDATE_FILAMENT ACTION=UNLOAD
  ENDER_FILAMENT ACTION=UNLOAD {rawparams}

[gcode_macro _ENDER_VALIDATE_FILAMENT]
gcode:
  {% set s = printer["gcode_macro _ENDER_FILAMENT_SETTINGS"] %}
  {% if s.calibrated|int != 1 %}
    {action_raise_error("Measure distances and calibrate filament sequences")}
  {% endif %}
  {% if s.chunk_mm <= 0 or s.chunk_mm > 20 %}
    {action_raise_error("chunk_mm must be greater than 0 and at most 20 mm")}
  {% endif %}
  {% if params.ACTION == 'LOAD' %}
    {% if s.capture_mm <= 0 or s.melt_mm <= 0 or s.purge_mm <= 0 %}
      {action_raise_error("Calibrate capture, nozzle feed and purge")}
    {% endif %}
  {% else %}
    {% if s.tip_push_mm <= 0 or s.tip_retract_mm <= 0 or s.unload_mm <= s.tip_retract_mm or s.cooling_move_mm < 0 or s.cooling_moves < 0 or s.tip_dwell_ms < 0 %}
      {action_raise_error("Calibrate tip forming and total retraction")}
    {% endif %}
  {% endif %}

[gcode_macro _ENDER_LOAD_BODY]
gcode:
  {% set s = printer["gcode_macro _ENDER_FILAMENT_SETTINGS"] %}
  _ENDER_MOVE_FILAMENT MM={s.capture_mm} SPEED={s.capture_speed}
  _ENDER_MOVE_FILAMENT MM={s.melt_mm} SPEED={s.melt_speed}
  _ENDER_MOVE_FILAMENT MM={s.purge_mm} SPEED={s.purge_speed}

[gcode_macro _ENDER_UNLOAD_BODY]
gcode:
  {% set s = printer["gcode_macro _ENDER_FILAMENT_SETTINGS"] %}
  _ENDER_MOVE_FILAMENT MM={s.tip_push_mm} SPEED={s.tip_push_speed}
  _ENDER_MOVE_FILAMENT MM={0 - s.tip_retract_mm} SPEED={s.tip_retract_speed}
  ENDER_FILAMENT_CHECK
  G4 P{s.tip_dwell_ms}
  {% for n in range(s.cooling_moves|int) %}
    _ENDER_MOVE_FILAMENT MM={s.cooling_move_mm} SPEED={s.cooling_speed}
    _ENDER_MOVE_FILAMENT MM={0 - s.cooling_move_mm} SPEED={s.cooling_speed}
  {% endfor %}
  _ENDER_MOVE_FILAMENT MM={0 - (s.unload_mm + s.tip_push_mm - s.tip_retract_mm)} SPEED={s.unload_speed}

[gcode_macro _ENDER_MOVE_FILAMENT]
gcode:
  {% set s = printer["gcode_macro _ENDER_FILAMENT_SETTINGS"] %}
  {% set mm = params.MM|float %}
  {% set speed = params.SPEED|float %}
  {% if speed <= 0 %}
    {action_raise_error("Filament speed must be positive")}
  {% endif %}
  {% set count = (mm|abs / s.chunk_mm)|round(0, 'ceil')|int %}
  {% if count > 0 %}
    {% for n in range(count) %}
      ENDER_FILAMENT_CHECK
      G1 E{mm / count} F{speed * 60}
      M400
    {% endfor %}
  {% endif %}
  ENDER_FILAMENT_CHECK
