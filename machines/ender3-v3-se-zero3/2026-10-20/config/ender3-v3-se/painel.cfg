[gcode_macro _BMCU_AJUSTES_MEDIDOS]
variable_captura_mm: 20.0
variable_captura_velocidade: 180.0
variable_avanco_bico_mm: 60.0
variable_avanco_bico_velocidade: 120.0
variable_recuo_apos_switch_mm: 55.0
gcode:
  {action_respond_info("Valores medidos para PETG: captura 20 mm a F180; avanço adicional 60 mm a F120; recuo após liberar o switch 55 mm.")}

[gcode_macro _ENDER_EXIGIR_OCIOSA]
gcode:
  {% if printer.print_stats.state in ('printing', 'paused') %}
    {action_raise_error("Finalize a impressão antes de iniciar a calibração.")}
  {% endif %}

[gcode_macro ENDER_CONFERIR_SONDA]
description: Conferir a repetibilidade da sonda em dez medições
gcode:
  _ENDER_EXIGIR_OCIOSA
  BMCU_STOP
  G28
  BED_MESH_CLEAR
  PROBE_ACCURACY SAMPLES=10

[gcode_macro ENDER_CALIBRAR_Z]
description: Iniciar o ajuste do Z-offset com papel e bico limpo
gcode:
  _ENDER_EXIGIR_OCIOSA
  BMCU_STOP
  G28
  BED_MESH_CLEAR
  PROBE_CALIBRATE

[gcode_macro ENDER_CALIBRAR_MALHA]
description: Aquecer a mesa e medir uma malha de 49 pontos
gcode:
  {% set temperatura = params.TEMP_MESA|default(70)|float %}
  _ENDER_EXIGIR_OCIOSA
  BMCU_STOP
  M190 S{temperatura}
  G28
  BED_MESH_CLEAR
  BED_MESH_CALIBRATE PROBE_COUNT=7,7 ALGORITHM=bicubic
  {action_respond_info("Após conferir o resultado, execute SAVE_CONFIG para salvar a malha.")}

[gcode_macro ENDER_AQUECER_PETG]
description: Aquecer bico e mesa com temperaturas ajustáveis
gcode:
  M104 S{params.TEMP_BICO|default(240)|float}
  M140 S{params.TEMP_MESA|default(70)|float}

[gcode_macro BMCU_CAPTURAR_FILAMENTO]
description: Testar captura com a extrusora começando primeiro
gcode:
  {% set ajustes = printer["gcode_macro _BMCU_AJUSTES_MEDIDOS"] %}
  BMCU_TESTAR_EXTRUSAO CANAL={params.CANAL|default(2)|int} MM={params.MM|default(ajustes.captura_mm)|float} VELOCIDADE={params.VELOCIDADE|default(ajustes.captura_velocidade)|float} EXTRUSORA_PRIMEIRO=1

[gcode_macro BMCU_CONFERIR_SWITCH]
description: Consultar o sensor de chegada do filamento
gcode:
  QUERY_FILAMENT_SENSOR SENSOR=bmcu_entry

[gcode_macro BMCU_PARAR_FILAMENTO]
description: Parar os motores de alimentação da BMCU
gcode:
  BMCU_STOP
