
[bmcu]

transport_sidecar: True
transport_socket_dir: /tmp/bmcu-transport

u1_planner_timeout: 15.0
u1_planner_poll_interval: 0.20
sidecar_status_interval: 1.00
baud: 115200
connect_settle_time: 1.5
reconnect_interval: 1.0
reconnect_max: 30.0
connection_timeout: 15.0

sidecar_ipc_resume_grace: 5.0

sidecar_ipc_outage_timeout: 12.0
heartbeat_interval: 5.0

manager_tick_interval: 0.50

manager_idle_interval: 2.0
connect_spread: 0.05

rx_budget_bytes: 256
rx_budget_packets: 2
rx_budget_ms: 0.5
callback_warning_ms: 10.0

status_cache_interval: 1.0
status_cache_idle_interval: 5.0

reactor_yield_interval: 0.005
manager_work_yield_interval: 0.010

critical_motion_release_delay: 0.500

critical_transport_interval: 1.0
critical_rx_budget_bytes: 128
critical_rx_budget_packets: 1
critical_rx_budget_ms: 0.15
critical_reactor_yield_interval: 0.020

transport_min_buffer: 1.50
transport_retry_interval: 5.00

required_runtime_sync_timeout: 30.0
tx_queue_limit: 4096

pause_on_error: True

debug: False

firmware_update_power_pin:
firmware_update_power_settle_time: 0.35

controller_mode: standalone

load_speed_mms: 80
pull_speed_mms: 80
pull_speed_end_mms: 12
load_pressure_pct: 82
jam_timeout_ms: 20000
before_pullback_target_pct: 40

contact_buffer_pct: 82
contact_timeout: 100
max_route_mm: 5000
bite_mm: 8
bite_feed: 180
bite_encoder_ratio: 0.35
bite_buffer_delta: 2
bite_retries: 2
retry_retract_mm: 2
capture_mm: 28
capture_feed: 300
capture_encoder_ratio: 0.35
unload_timeout: 60
release_retract_mm: 0
release_retract_feed: 1200
encoder_test_mm: 50

devices:
    bmcu0,/dev/ttyS1
