
[gcode_macro BMCU_EMERGENCY_STOP]
description: Stop all BMCU motion immediately
gcode:
    BMCU_STOP

[gcode_macro BMCU_ENCODER_TEST_PRIMARY]
description: Test 50 mm of measured filament movement on Channel 1
gcode:
    BMCU_TEST_ENCODER CHANNEL=0 MM=50

[gcode_macro BMCU_AUTOLOAD_PRIMARY]
description: Feed 120 mm into Channel 1 and validate encoder movement
gcode:
    BMCU_CHANNEL_AUTOLOAD CHANNEL=0 MM=120
