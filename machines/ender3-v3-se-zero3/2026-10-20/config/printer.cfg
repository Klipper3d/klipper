[include bmcu-purga.cfg]
# Creality Ender 3 V3 SE with CR4NS200320C14 board and a physically
# verified GD32F303RET6 MCU.
#
# Build this configuration with the STM32F103 compatibility target, a
# 28KiB bootloader, an 8 MHz crystal, and USART1 PA10/PA9. Also enable
# "Creality Ender 3 V3 SE stock display bridge" in the low-level menu.
# See docs/Ender3_V3_SE.md before flashing or moving the printer.
#
# This is a commissioning configuration. It intentionally contains no
# saved bed mesh, pressure advance, input shaper, PID tune, or calibrated
# Z offset. Run the documented calibrations before printing.

[include mainsail.cfg]
[include ender3-v3-se/board.cfg]
[include ender3-v3-se/motion.cfg]
[include ender3-v3-se/calibration.cfg]
[include ender3-v3-se/display.cfg]
[include ender3-v3-se/macros.cfg]
[include bmcu-switch.cfg]

# Keep autosave-managed placeholders in this top-level file. SAVE_CONFIG can
# comment these values out, but intentionally rejects conflicts in includes.
[extruder]
#control: watermark

[heater_bed]
#control: watermark

[bltouch]
#z_offset: 0.0

# BEGIN BMCU-KLIPPER AUTO-INCLUDE
[include bmcu/bmcu.cfg]
[include bmcu/bmcu_macros.cfg]
[include bmcu/bmcu_panel.cfg]
# END BMCU-KLIPPER AUTO-INCLUDE

[include ender3-v3-se/painel.cfg]

[include ender3-v3-se/impressao.cfg]

[include bmcu-multicor-ender.cfg]

