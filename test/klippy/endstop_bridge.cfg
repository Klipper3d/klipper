# Simulated dual-MCU cartesian printer; not a hardware pin map.
[include load_cell.cfg]

[mcu nozzle_mcu]
serial: /dev/ttyACM1

[endstop_bridge sync]
input_x_pin: ^nozzle_mcu:PC0
input_y_pin: ^!nozzle_mcu:PC2
output_pin: !nozzle_mcu:PC1
receive_pin: ^!PC3

[stepper_x]
endstop_pin: bridge:sync:x

[stepper_y]
endstop_pin: bridge:sync:y

[load_cell_probe]
sclk_pin: nozzle_mcu:PJ2
dout_pin: nozzle_mcu:PJ3
trigger_bridge: sync
